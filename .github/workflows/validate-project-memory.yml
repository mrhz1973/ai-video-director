name: Validate project memory

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate structure and public-data policy
        run: python3 scripts/validate_project.py
      - name: Validate harness output naming
        run: node --test comfyui-harness/test/output-naming.test.mjs

