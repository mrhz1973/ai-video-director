name: Validate project memory

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate structure and public-data policy
        run: python3 scripts/validate_project.py
      - name: Validate harness output manager and GPU power syntax
        run: |
          node --check comfyui-harness/public/output-naming.mjs
          node --check comfyui-harness/public/output-ui.mjs
          node --check comfyui-harness/lib/gpu-power.mjs
          node --check comfyui-harness/lib/gpu-power-helper.mjs
          node --check comfyui-harness/public/gpu-power-ui.mjs
      - name: Run full harness test suite
        working-directory: comfyui-harness
        run: npm test

